name: universal_file_viewer
description: "A Flutter package to preview local and remote files with inline viewers and external fallback."
version: 0.1.7
homepage: https://github.com/Shonu72/
repository: https://github.com/Shonu72/universal_file_viewer

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=1.17.0"

platforms:
  android:
  ios:
  macos:

dependencies:
  flutter:
    sdk: flutter

  open_file: 4.0.0
  video_player: ^2.14.1
  pdfrx: ^2.12.0
  excel_community: ^2.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  archive: ^4.6.0
  xml: ^6.3.0
  http: ^1.6.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - filepreviewer
  - widgets
  - package
